<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Mock Exam — Quick Poll</title>
	<style>
		:root{
			--bg1:#0f172a;
			--bg2:#0b1320;
			--card:#0b1220cc;
			--accent:#7c5cff;
			--muted:#9aa4bf;
		}
		html,body{height:100%;}
		body{
			margin:0;
			font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
			background: radial-gradient(1200px 600px at 10% 10%, rgba(124,92,255,0.12), transparent 10%),
									linear-gradient(180deg,var(--bg1),var(--bg2));
			color:#e6eef8;
			-webkit-font-smoothing:antialiased;
			-moz-osx-font-smoothing:grayscale;
			display:flex;
			align-items:center;
			justify-content:center;
			padding:2rem;
		}
		.card{
			width:min(680px,95vw);
			background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
			border-radius:14px;
			padding:2.25rem;
			box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
			border:1px solid rgba(255,255,255,0.04);
			backdrop-filter: blur(8px) saturate(120%);
			text-align:center;
		}
		h1{margin:0 0 .5rem;font-size:1.5rem;letter-spacing:-0.2px}
		p.lead{margin:0 0 1.25rem;color:var(--muted)}
		.choices{
			display:flex;
			gap:12px;
			justify-content:center;
			margin-top:1rem;
			flex-wrap:wrap;
		}
		.btn{
			appearance:none;
			-webkit-appearance:none;
			background:transparent;
			border:1px solid rgba(255,255,255,0.06);
			padding:0.65rem 1.05rem;
			border-radius:10px;
			color:inherit;
			font-weight:600;
			cursor:pointer;
			min-width:96px;
			transition:all .18s ease;
			text-decoration:none;
			display:inline-flex;
			align-items:center;
			justify-content:center;
		}
		.btn:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(124,92,255,0.12)}
		.btn.primary{
			background:linear-gradient(90deg,var(--accent),#5ef7d8 120%);
			color:#071028;
			border: none;
			box-shadow: 0 8px 24px rgba(124,92,255,0.18);
		}
		.btn.ghost{background:rgba(255,255,255,0.02)}
		.small{font-size:.95rem;padding:.5rem .85rem}
		footer{margin-top:1.25rem;color:var(--muted);font-size:.9rem}
		.secret-btn{
			display:inline-block;margin-left:12px;padding:.5rem .85rem;border-radius:10px;background:rgba(255,255,255,0.04);color:inherit;text-decoration:none;font-weight:700;border:1px solid rgba(255,255,255,0.04);transition:transform .14s ease,box-shadow .14s ease;
		}
		.secret-btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,0.35)}
		@media (max-width:420px){
			.card{padding:1.25rem}
			h1{font-size:1.2rem}
		}
	</style>
</head>
<body>
	<main class="card" role="main" aria-labelledby="pollTitle">
		<h1 id="pollTitle">Are we passing mock exams?</h1>
		<p class="lead">Choose the answer that best represents your mood right now.</p>

		<div class="choices" role="group" aria-label="Answer choices">
			<a class="btn primary" href="yes.html">Yes</a>
			<a class="btn ghost" href="no.html">No</a>
			<a class="btn" href="67.html">67</a>
		</div>

		<footer>Just pick an answer dam it
			<a href="secrets.html" class="secret-btn">Secrets to acing the mocks</a>
		</footer>
	</main>
</body>
</html>
