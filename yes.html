<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YAS GURL</title>
  <style>
    html,body{height:100%;margin:0}
    body{
      background:linear-gradient(135deg,#ff6fc0 0%,#ff2d95 50%,#ff8ad1 100%);
      font-family:Inter,system-ui,Arial;
      display:flex;align-items:center;justify-content:center;overflow:hidden;color:#071028
    }
    .card{
      text-align:center;padding:2.25rem;border-radius:18px;background:rgba(255,255,255,0.85);box-shadow:0 12px 40px rgba(8,10,18,0.15);
      max-width:820px;width:92%;backdrop-filter:blur(6px);
    }
    h1{font-size:2rem;margin:0 0 .25rem}
    p{margin:.25rem 0 0;font-weight:600;color:#2b2b2b}
    .emoji{position:fixed;pointer-events:none;font-size:28px;opacity:.9;transform:translate3d(0,0,0)}
    @keyframes floaty{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(8deg)}100%{transform:translateY(0) rotate(0deg)}}
  </style>
</head>
<body>
  <div class="card">
    <h1>YAS GURL U GOT THISSSUH 💖✨💅</h1>
    <p>Go smash it — we believe in you!</p>
  </div>

  <script>
    // generate cheerful emoji confetti background
    const emojis = ['💖','✨','💅','🌸','💗','🌟','🎀','💕','😻'];
    const count = 40;
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className='emoji';
      el.style.left = Math.random()*100 + 'vw';
      el.style.top = Math.random()*100 + 'vh';
      el.style.fontSize = (18 + Math.random()*48) + 'px';
      el.style.opacity = (0.5 + Math.random()*0.6).toFixed(2);
      el.style.animation = `floaty ${6 + Math.random()*6}s ease-in-out ${Math.random()*2}s infinite`;
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      document.body.appendChild(el);
    }
  </script>
</body>
</html>
